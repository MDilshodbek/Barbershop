name: CI/CD

on:
  push:
    branches: [master]
    # Changes that don't affect the running app don't trigger a deploy
    paths-ignore:
      - '**.md'
      - 'scripts/**'
      - 'nginx/**'
      - 'deploy.ps1'
      - '.env.example'
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the current one
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege by default; jobs widen only what they need
permissions:
  contents: read

env:
  # GHCR image names must be lowercase
  IMAGE_NAME: ghcr.io/mdilshodbek/barbershop

jobs:
  ci:
    # The compile step happens once, inside the Docker build (next job)
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Report-only until existing lint errors are cleaned up (no --fix in CI)
      - name: Lint (report only)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true

      - name: Test
        run: npm test -- --passWithNoTests

  docker:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Runs ON the AWS server via a self-hosted runner: the server connects out to GitHub,
  # so GitHub never needs the server's (changing) public IP.
  deploy:
    name: Deploy to AWS server
    needs: docker
    runs-on: [self-hosted, linux, barbershop]
    environment: production
    permissions:
      contents: read
      packages: read
    env:
      APP_DIR: ${{ vars.APP_DIR }}
      IMAGE_TAG: ${{ needs.docker.outputs.tag }}
    steps:
      # Only the two deployment files are needed, not the whole source code
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docker-compose.yml
            deploy.sh
          sparse-checkout-cone-mode: false

      - name: Copy deployment files to the app folder
        run: |
          test -n "$APP_DIR" || { echo "Repository variable APP_DIR is not set" >&2; exit 1; }
          cp docker-compose.yml deploy.sh "$APP_DIR/"
          chmod +x "$APP_DIR/deploy.sh"

      - name: Log in to GHCR
        # Short-lived job token: valid only while this job runs, read-only for packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull image and restart containers
        run: $APP_DIR/deploy.sh "$IMAGE_TAG"

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
