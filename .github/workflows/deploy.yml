name: CI/CD

on:
  push:
    branches: [master]
  workflow_dispatch:

# Never run two deploys at the same time; a newer push waits for the current one
concurrency:
  group: deploy-production
  cancel-in-progress: false

# Least privilege by default; jobs widen only what they need
permissions:
  contents: read

env:
  # GHCR image names must be lowercase
  IMAGE_NAME: ghcr.io/mdilshodbek/barbershop

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Report-only until existing lint errors are cleaned up (no --fix in CI)
      - name: Lint (report only)
        run: npx eslint "{src,apps,libs,test}/**/*.ts"
        continue-on-error: true

      - name: Test
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build

  docker:
    name: Build and push image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to VPS
    needs: docker
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4

      - name: Upload compose file and deploy script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          source: docker-compose.yml,deploy.sh
          target: ${{ secrets.VPS_APP_DIR }}

      - name: Pull image and restart containers
        uses: appleboy/ssh-action@v1.2.0
        env:
          APP_DIR: ${{ secrets.VPS_APP_DIR }}
          IMAGE_TAG: ${{ needs.docker.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          # Short-lived job token: valid only while this job runs, read-only for packages
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          envs: APP_DIR,IMAGE_TAG,GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd "$APP_DIR"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            chmod +x deploy.sh
            status=0
            ./deploy.sh "$IMAGE_TAG" || status=$?
            docker logout ghcr.io
            exit $status
