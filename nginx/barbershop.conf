# Nginx config for the Barbershop API (HTTPS + fast image delivery).
# Server location: /etc/nginx/sites-available/barbershop
# Replace every "api.example.com" with your real API domain.

# WebSocket upgrade for the AI chat; plain requests keep upstream connections alive
map $http_upgrade $connection_upgrade {
	default upgrade;
	''      '';
}

upstream barbershop_api {
	server 127.0.0.1:4001;
	keepalive 16;
}

# HTTP -> HTTPS redirect
server {
	listen 80;
	listen [::]:80;
	server_name api.example.com;

	return 301 https://$host$request_uri;
}

server {
	listen 443 ssl http2;
	listen [::]:443 ssl http2;
	server_name api.example.com;

	# Let's Encrypt certificate (created by certbot)
	ssl_certificate     /etc/letsencrypt/live/api.example.com/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/api.example.com/privkey.pem;
	ssl_protocols TLSv1.2 TLSv1.3;
	ssl_session_cache shared:SSL:10m;
	ssl_session_timeout 1d;
	ssl_session_tickets off;

	# Image uploads up to 15 MB (matches graphqlUploadExpress maxFileSize)
	client_max_body_size 15m;

	# Compress API responses (GraphQL JSON); images are already compressed
	gzip on;
	gzip_comp_level 5;
	gzip_min_length 1024;
	gzip_proxied any;
	gzip_vary on;
	gzip_types application/json application/javascript text/css text/plain image/svg+xml;

	# Uploaded images: served by Nginx straight from disk, never touching Node.
	# File names are unique (uuid), so browsers can cache them for a year.
	location /uploads/ {
		alias /home/deploy/barbershop/uploads/;
		try_files $uri =404;

		add_header Cache-Control "public, max-age=31536000, immutable";
		add_header Access-Control-Allow-Origin "*";

		sendfile on;
		tcp_nopush on;
		access_log off;
	}

	# Everything else (GraphQL, WebSocket chat) goes to the backend container
	location / {
		proxy_pass http://barbershop_api;
		proxy_http_version 1.1;
		proxy_set_header Upgrade $http_upgrade;
		proxy_set_header Connection $connection_upgrade;
		proxy_set_header Host $host;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
		proxy_set_header X-Forwarded-Proto $scheme;

		# Keep idle chat connections open
		proxy_read_timeout 3600s;
		proxy_send_timeout 3600s;
	}
}
