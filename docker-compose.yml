services:
  barbershop:
    container_name: barbershop
    image: ghcr.io/mdilshodbek/barbershop:${IMAGE_TAG:-latest}
    restart: always
    env_file: .env
    environment:
      NODE_ENV: production
      PORT_API: 3007
    # Localhost only: Nginx on the VPS proxies to 4001; not reachable from the internet directly
    ports:
      - 4001:3007
    volumes:
      - ./uploads:/usr/src/barbershop/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3007/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - monorepo_network

  barbershop-batch:
    container_name: barbershop-batch
    image: ghcr.io/mdilshodbek/barbershop:${IMAGE_TAG:-latest}
    command: ['node', 'dist/apps/barbershop-batch/main']
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT_BATCH: 3008
    ports:
      - 4002:3008
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:3008/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    networks:
      - monorepo_network

networks:
  monorepo_network:
    driver: bridge
